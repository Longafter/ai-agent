<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AI SSE Chat 测试</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text',
          'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        padding: 24px 16px;
      }

      .shell {
        width: 100%;
        max-width: 720px;
      }

      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }

      .card {
        background: #ffffff;
        border-radius: 10px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
        padding: 16px 18px 18px;
      }

      label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        color: #6b7280;
      }

      textarea {
        width: 100%;
        min-height: 80px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        resize: vertical;
        font-family: inherit;
        font-size: 14px;
        outline: none;
      }

      textarea::placeholder {
        color: #9ca3af;
      }

      textarea:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.3);
      }

      .controls {
        display: flex;
        align-items: center;
        margin-top: 10px;
        gap: 10px;
      }

      button {
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid #2563eb;
        background: #3b82f6;
        color: #ffffff;
        font-size: 13px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .status {
        font-size: 12px;
        color: #6b7280;
      }

      .output {
        margin-top: 16px;
        padding: 10px 10px;
        border-radius: 8px;
        background: #111827;
        color: #e5e7eb;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          'Liberation Mono', 'Courier New', monospace;
        white-space: pre-wrap;
        max-height: 360px;
        overflow-y: auto;
      }

      /* 工具调用状态样式 - 醒目配色 */
      .tool-status {
        display: block;
        padding: 10px 16px;
        margin: 10px 0;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        font-family: system-ui, -apple-system, sans-serif;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      .tool-calling {
        background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
        color: #ffffff;
        border: 2px solid #c084fc;
        animation: pulse 1.5s ease-in-out infinite;
      }

      .tool-done {
        background: linear-gradient(135deg, #059669 0%, #10b981 100%);
        color: #ffffff;
        border: 2px solid #6ee7b7;
      }

      .tool-error {
        background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
        color: #ffffff;
        border: 2px solid #fca5a5;
      }

      .tool-name {
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .tool-args {
        opacity: 0.9;
        font-size: 12px;
        font-family: ui-monospace, monospace;
        margin-top: 4px;
        display: block;
      }

      .tool-result {
        opacity: 0.85;
        font-size: 11px;
        font-family: ui-monospace, monospace;
        margin-top: 4px;
        display: block;
        max-height: 60px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .error-message {
        background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
        color: #ffffff;
        padding: 12px 16px;
        border-radius: 8px;
        margin: 10px 0;
        font-size: 14px;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.85;
          transform: scale(0.99);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <h1>AI SSE Chat 测试</h1>
        <label for="query">输入你的问题：</label>
        <textarea
          id="query"
          placeholder="请输入要发送给 AI 的问题..."
        ></textarea>
        <div class="controls">
          <button id="sendBtn">开始对话（SSE）</button>
          <div class="status" id="status">状态：待机</div>
        </div>
        <div class="output" id="output"></div>
      </div>
    </div>

    <script>
      const sendBtn = document.getElementById('sendBtn');
      const queryInput = document.getElementById('query');
      const outputEl = document.getElementById('output');
      const statusEl = document.getElementById('status');

      let es = null;

      // 工具名称中文映射
      const toolNames = {
        send_mail: '发送邮件',
        db_users_crud: '数据库操作',
        web_search: '网络搜索',
        time_now: '获取时间',
        cron_job: '定时任务',
      };

      // 工具调用状态存储（用于关联 start 和 end 事件）
      const toolCallMap = new Map();

      function closeEventSource() {
        if (es) {
          es.close();
          es = null;
        }
        sendBtn.disabled = false;
      }

      /**
       * 获取工具显示名称
       */
      function getToolDisplayName(toolName) {
        return toolNames[toolName] || toolName;
      }

      /**
       * 格式化工具参数（简短显示）
       */
      function formatToolArgs(args) {
        if (!args || Object.keys(args).length === 0) {
          return '';
        }
        try {
          const str = JSON.stringify(args, null, 2);
          // 限制显示长度
          return str.length > 200 ? str.slice(0, 200) + '...' : str;
        } catch {
          return String(args);
        }
      }

      /**
       * 格式化工具结果（简短显示）
       */
      function formatToolResult(result) {
        if (!result) return '';
        const str = String(result);
        return str.length > 100 ? str.slice(0, 100) + '...' : str;
      }

      /**
       * 创建工具调用开始元素
       */
      function createToolStartEl(toolCallId, toolName, toolArgs) {
        const el = document.createElement('div');
        el.className = 'tool-status tool-calling';
        el.id = `tool-${toolCallId}`;
        const displayName = getToolDisplayName(toolName);

        el.innerHTML = `
          🔧 正在调用工具：<span class="tool-name">${displayName}</span>
          <span class="tool-args">参数: ${formatToolArgs(toolArgs)}</span>
        `;

        return el;
      }

      /**
       * 更新工具调用结束状态
       */
      function updateToolEndEl(toolCallId, toolName, result) {
        const el = document.getElementById(`tool-${toolCallId}`);
        if (!el) {
          // 如果找不到对应元素，创建一个新的完成元素
          const newEl = document.createElement('div');
          newEl.className = 'tool-status tool-done';
          const displayName = getToolDisplayName(toolName);
          newEl.innerHTML = `
            ✅ 工具 <span class="tool-name">${displayName}</span> 执行完成
            <span class="tool-result">结果: ${formatToolResult(result)}</span>
          `;
          outputEl.appendChild(newEl);
          return;
        }

        el.className = 'tool-status tool-done';
        const displayName = getToolDisplayName(toolName);
        el.innerHTML = `
          ✅ 工具 <span class="tool-name">${displayName}</span> 执行完成
          <span class="tool-result">结果: ${formatToolResult(result)}</span>
        `;
      }

      /**
       * 追加文本内容
       */
      function appendText(content) {
        // 查找最后一个文本节点，如果是文本节点则追加，否则创建新的
        const lastChild = outputEl.lastElementChild;
        if (lastChild && lastChild.tagName === 'SPAN' && lastChild.classList.contains('text-node')) {
          lastChild.textContent += content;
        } else {
          const span = document.createElement('span');
          span.className = 'text-node';
          span.textContent = content;
          outputEl.appendChild(span);
        }
        outputEl.scrollTop = outputEl.scrollHeight;
      }

      /**
       * 显示错误消息
       */
      function showError(message, toolName) {
        const el = document.createElement('div');
        el.className = 'error-message';
        
        if (toolName) {
          el.innerHTML = `❌ 工具 <strong>${getToolDisplayName(toolName)}</strong> 执行出错: ${message}`;
        } else {
          el.textContent = `❌ 错误: ${message}`;
        }
        
        outputEl.appendChild(el);
        outputEl.scrollTop = outputEl.scrollHeight;
      }

      /**
       * 处理结构化事件
       */
      function handleEvent(event) {
        const { type, timestamp, ...data } = event;

        switch (type) {
          case 'text':
            // 文本内容增量
            appendText(data.content);
            break;

          case 'tool_start':
            // 工具调用开始
            {
              const el = createToolStartEl(
                data.toolCallId,
                data.toolName,
                data.toolArgs
              );
              outputEl.appendChild(el);
              outputEl.scrollTop = outputEl.scrollHeight;
              // 存储工具调用信息
              toolCallMap.set(data.toolCallId, {
                toolName: data.toolName,
                startTime: timestamp,
              });
            }
            break;

          case 'tool_end':
            // 工具调用结束
            updateToolEndEl(
              data.toolCallId,
              data.toolName,
              data.result
            );
            outputEl.scrollTop = outputEl.scrollHeight;
            // 清理存储
            toolCallMap.delete(data.toolCallId);
            break;

          case 'error':
            // 错误事件
            showError(data.message, data.toolName);
            break;

          case 'done':
            // 流结束
            statusEl.textContent = '状态：完成';
            closeEventSource();
            break;

          default:
            console.warn('未知事件类型:', type, data);
        }
      }

      sendBtn.onclick = () => {
        const query = queryInput.value.trim();
        if (!query) {
          alert('请输入问题');
          return;
        }

        closeEventSource();
        outputEl.innerHTML = '';
        toolCallMap.clear();
        sendBtn.disabled = true;
        statusEl.textContent = '状态：连接中…';

        const url = `/ai/chat/stream?query=${encodeURIComponent(query)}`;
        es = new EventSource(url);

        es.onopen = () => {
          statusEl.textContent = '状态：已连接，流式接收中…';
        };

        es.onmessage = (event) => {
          try {
            // 解析 JSON 结构化事件
            const eventData = JSON.parse(event.data);
            handleEvent(eventData);
          } catch (e) {
            // 如果解析失败，可能是旧格式或纯文本，直接显示
            console.warn('事件解析失败，直接显示:', event.data);
            appendText(event.data);
          }
        };

        es.onerror = () => {
          statusEl.textContent = '状态：连接结束或发生错误';
          closeEventSource();
        };
      };

      window.addEventListener('beforeunload', closeEventSource);
    </script>
  </body>
</html>

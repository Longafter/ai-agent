<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AI SSE Chat 测试</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text',
          'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        padding: 24px 16px;
      }

      .shell {
        width: 100%;
        max-width: 720px;
      }

      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }

      .card {
        background: #ffffff;
        border-radius: 10px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
        padding: 16px 18px 18px;
      }

      label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        color: #6b7280;
      }

      textarea {
        width: 100%;
        min-height: 80px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        resize: vertical;
        font-family: inherit;
        font-size: 14px;
        outline: none;
      }

      textarea::placeholder {
        color: #9ca3af;
      }

      textarea:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.3);
      }

      .controls {
        display: flex;
        align-items: center;
        margin-top: 10px;
        gap: 10px;
      }

      button {
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid #2563eb;
        background: #3b82f6;
        color: #ffffff;
        font-size: 13px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .status {
        font-size: 12px;
        color: #6b7280;
      }

      .output {
        margin-top: 16px;
        padding: 10px 10px;
        border-radius: 8px;
        background: #111827;
        color: #e5e7eb;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          'Liberation Mono', 'Courier New', monospace;
        white-space: pre-wrap;
        max-height: 360px;
        overflow-y: auto;
      }

      /* 工具调用状态样式 - 醒目配色 */
      .tool-status {
        display: block;
        padding: 10px 16px;
        margin: 10px 0;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        font-family: system-ui, -apple-system, sans-serif;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      .tool-calling {
        background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
        color: #ffffff;
        border: 2px solid #c084fc;
        animation: pulse 1.5s ease-in-out infinite;
      }

      .tool-done {
        background: linear-gradient(135deg, #059669 0%, #10b981 100%);
        color: #ffffff;
        border: 2px solid #6ee7b7;
      }

      .tool-name {
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .tool-args {
        opacity: 0.9;
        font-size: 12px;
        font-family: ui-monospace, monospace;
        margin-top: 4px;
        display: block;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.85;
          transform: scale(0.99);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <h1>AI SSE Chat 测试</h1>
        <label for="query">输入你的问题：</label>
        <textarea
          id="query"
          placeholder="请输入要发送给 AI 的问题..."
        ></textarea>
        <div class="controls">
          <button id="sendBtn">开始对话（SSE）</button>
          <div class="status" id="status">状态：待机</div>
        </div>
        <div class="output" id="output"></div>
      </div>
    </div>

    <script>
      const sendBtn = document.getElementById('sendBtn');
      const queryInput = document.getElementById('query');
      const outputEl = document.getElementById('output');
      const statusEl = document.getElementById('status');

      let es = null;

      // 工具名称中文映射
      const toolNames = {
        send_mail: '发送邮件',
        db_users_crud: '数据库操作',
        web_search: '网络搜索',
        time_now: '获取时间',
        cron_job: '定时任务',
      };

      function closeEventSource() {
        if (es) {
          es.close();
          es = null;
        }
        sendBtn.disabled = false;
      }

      // 创建工具调用状态元素
      function createToolStatusEl(type, toolName, args) {
        const el = document.createElement('div');
        el.className = `tool-status ${type}`;
        const displayName = toolNames[toolName] || toolName;

        if (type === 'tool-calling') {
          el.innerHTML = `🔧 正在调用工具：<span class="tool-name">${displayName}</span>`;
          if (args && args !== '{}') {
            el.innerHTML += `<span class="tool-args">参数: ${args}</span>`;
          }
        } else {
          el.innerHTML = `✅ 工具 <span class="tool-name">${displayName}</span> 执行完成`;
        }
        return el;
      }

      sendBtn.onclick = () => {
        const query = queryInput.value.trim();
        if (!query) {
          alert('请输入问题');
          return;
        }

        closeEventSource();
        outputEl.innerHTML = '';
        sendBtn.disabled = true;
        statusEl.textContent = '状态：连接中…';

        const url = `/ai/chat/stream?query=${encodeURIComponent(query)}`;
        es = new EventSource(url);

        es.onopen = () => {
          statusEl.textContent = '状态：已连接，流式接收中…';
        };

        es.onmessage = (event) => {
          const data = event.data;

          // 使用 includes 和 startsWith 检测，比正则更可靠
          // 格式: 【调用工具:工具名:参数】
          // 格式: 【工具完成:工具名】

          if (data.startsWith('【调用工具:')) {
            // 解析: 【调用工具:工具名:参数】
            const content = data.slice(5, -1); // 去掉 "【调用工具:" 和 "】"
            const colonIndex = content.indexOf(':');
            const toolName = colonIndex > -1 ? content.slice(0, colonIndex) : content;
            const toolArgs = colonIndex > -1 ? content.slice(colonIndex + 1) : '{}';

            const el = createToolStatusEl('tool-calling', toolName, toolArgs);
            outputEl.appendChild(el);
            outputEl.scrollTop = outputEl.scrollHeight;
          } else if (data.startsWith('【工具完成:')) {
            // 解析: 【工具完成:工具名】
            const toolName = data.slice(6, -1); // 去掉 "【工具完成:" 和 "】"

            const el = createToolStatusEl('tool-done', toolName);
            outputEl.appendChild(el);
            outputEl.scrollTop = outputEl.scrollHeight;
          } else {
            // 普通文本内容
            const textNode = document.createTextNode(data);
            outputEl.appendChild(textNode);
          }
        };

        es.onerror = () => {
          statusEl.textContent = '状态：连接结束或发生错误';
          closeEventSource();
        };
      };

      window.addEventListener('beforeunload', closeEventSource);
    </script>
  </body>
</html>
